name: TestSentry CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  testsentry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt', 'requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest-cov selenium playwright
          python -m playwright install --with-deps chromium
      - name: Run unit and integration tests
        env:
          TESTSENTRY_API_KEY: ci-test-key
        run: pytest tests/ -v --tb=short --cov=src/testsentry --cov-report=term-missing --cov-report=json
      - name: Generate TestSentry report
        if: always()
        run: testsentry scan --output report.html
      - name: Upload HTML report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsentry-report-${{ matrix.python-version }}
          path: |
            report.html
            coverage.json
          retention-days: 30
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request' && matrix.python-version == '3.11'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## TestSentry Health Report
            Tests and coverage completed. Download the report from the Actions artifacts.
            Run ID: ${{ github.run_id }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
